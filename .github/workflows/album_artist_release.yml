name: album-artist-release
# Builds the "Phonograph Plus AA" fork APK (package player.phonograph.plus.albumartist), UNSIGNED.
# The maintainer downloads the artifact, signs it locally with the fork key and attaches it to a release.
on:
  push:
    tags:
      - "aa-*"
  workflow_dispatch:

jobs:
  build:
    name: Build ModernAlbumartistRelease (unsigned)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew app:assembleModernAlbumartistRelease --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PhonographPlusAA-unsigned
          path: app/build/outputs/apk/modernAlbumartist/release/*.apk
          retention-days: 30
